[package]
name = "chinese-lesson-studio"
version = "0.1.0"
description = "Offline-first desktop editor for presenting Chinese lessons to children"
edition = "2021"
# std::fs::File::try_lock (lesson locks) is stable since 1.89.
rust-version = "1.89"

[lib]
name = "chinese_lesson_studio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hex = "0.4"
unicode-normalization = "0.1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif"] }
trash = "5"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "gzip", "brotli"] }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
base64 = "0.22"
url = "2"
percent-encoding = "2"
# Already in the tree through Tauri; used to space out image searches.
tokio = { version = "1", features = ["sync", "time"] }

# Decoding and resizing photos is many times slower unoptimised; optimise just
# the image crates so debug builds stay quick to compile but imports stay fast.
[profile.dev.package.image]
opt-level = 3
[profile.dev.package.zune-jpeg]
opt-level = 3
[profile.dev.package.png]
opt-level = 3
[profile.dev.package.fdeflate]
opt-level = 3
[profile.dev.package.image-webp]
opt-level = 3
